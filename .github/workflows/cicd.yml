name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/vixisoft/k8s-formation-demo-app:latest \
            -t ghcr.io/vixisoft/k8s-formation-demo-app:${{ github.run_number }} .

      - name: Push image
        run: |
          docker push ghcr.io/vixisoft/k8s-formation-demo-app:latest
          docker push ghcr.io/vixisoft/k8s-formation-demo-app:${{ github.run_number }}

      - name: Checkout workloads repository
        uses: actions/checkout@v4
        with:
          repository: vixisoft/k8s-formation-workloads
          token: ${{ secrets.WORKLOADS_PAT }}
          path: workloads

      - name: Rebuild workload chart
        run: |
          rm -rf workloads/my-demo-app
          mkdir -p workloads/my-demo-app
          cp -R demo-app/* workloads/my-demo-app/

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag
        run: |
          yq -i '.image.tag = "${{ github.run_number }}"' \
            workloads/my-demo-app/values.yaml

      - name: Commit workload changes
        run: |
          cd workloads

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Release my-demo-app ${{ github.run_number }}" || exit 0

          git push